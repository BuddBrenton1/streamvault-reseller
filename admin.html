<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>StreamVault — Admin Panel</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0c0e12;--sidebar:#111318;--card:#161920;--border:#1f2530;--text:#e8eaf0;--sub:#5a6478;--muted:#2a3040;--accent:#1a6ef5;--gold:#f0a500}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh}
input,select{background:var(--card);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 13px;font-size:13px;outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
button{cursor:pointer;font-family:inherit;border:none;border-radius:8px;font-weight:700;transition:opacity .15s}
button:hover{opacity:.85}
.btn-primary{background:linear-gradient(135deg,#1a6ef5,#7c3aed);color:#fff;padding:9px 20px;font-size:13px}
.btn-secondary{background:var(--muted);color:var(--sub);padding:9px 20px;font-size:13px}
.btn-danger{background:rgba(239,68,68,.15);color:#f87171;padding:7px 14px;font-size:12px}
.btn-success{background:rgba(34,197,94,.15);color:#4ade80;padding:7px 14px;font-size:12px}
.btn-sm{padding:6px 12px;font-size:12px}
label{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:5px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.badge{display:inline-block;border-radius:4px;padding:2px 7px;font-size:11px;font-weight:700}
.badge-green{background:rgba(34,197,94,.15);color:#4ade80}
.badge-red{background:rgba(239,68,68,.15);color:#f87171}
.badge-blue{background:rgba(59,130,246,.15);color:#60a5fa}
.badge-yellow{background:rgba(240,165,0,.15);color:var(--gold)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a2035;border:1px solid var(--accent);border-radius:10px;padding:12px 24px;font-size:13px;font-weight:600;color:#60a5fa;z-index:9999;box-shadow:0 4px 20px rgba(59,130,246,.3)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:#161920;border:1px solid var(--border);border-radius:18px;padding:28px;width:460px;max-width:94vw}
#login-screen{display:flex;align-items:center;justify-content:center;height:100vh}
.login-box{width:360px}
.logo{text-align:center;margin-bottom:28px}
.logo-name{font-size:24px;font-weight:900;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo-sub{font-size:11px;color:var(--sub);margin-top:3px;letter-spacing:2px}
#app{display:none;height:100vh;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:0 24px;height:56px;background:var(--sidebar);border-bottom:1px solid var(--border);flex-shrink:0}
.shell{display:flex;flex:1;overflow:hidden}
.sidenav{width:200px;background:var(--sidebar);border-right:1px solid var(--border);padding:12px 10px;flex-shrink:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;cursor:pointer;margin-bottom:2px;font-size:14px;font-weight:500;color:var(--sub);border-left:3px solid transparent;transition:all .15s}
.nav-item:hover{background:var(--muted);color:var(--text)}
.nav-item.active{background:rgba(26,110,245,.2);color:#fff;font-weight:700;border-left-color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:28px}
.page{display:none}.page.active{display:block}
.page-title{font-size:22px;font-weight:900;margin-bottom:24px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
.stat-val{font-size:28px;font-weight:900;margin-bottom:4px}
.stat-lbl{font-size:11px;color:var(--sub);font-weight:700;letter-spacing:.5px;text-transform:uppercase}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
th{font-size:10px;color:var(--sub);font-weight:700;letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.02)}
tr:hover td{background:rgba(255,255,255,.015)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.field{margin-bottom:14px}
.error-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);border-radius:8px;padding:10px 14px;font-size:13px;color:#f87171;margin-bottom:14px;display:none}
@media(max-width:700px){.stats-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="logo">
      <div style="font-size:40px;margin-bottom:8px">⚡</div>
      <div class="logo-name">StreamVault Admin</div>
      <div class="logo-sub">CONTROL PANEL</div>
    </div>
    <div class="card">
      <div class="field"><label>Email</label><input id="a-email" type="email" placeholder="admin@streamvault.com" style="width:100%"/></div>
      <div class="field"><label>Password</label><input id="a-pass" type="password" placeholder="••••••••" style="width:100%"/></div>
      <div id="a-err" class="error-box"></div>
      <button class="btn-primary" style="width:100%;padding:11px;font-size:14px" onclick="doLogin()">Sign In as Admin</button>
    </div>
  </div>
</div>

<div id="app" style="display:none;height:100vh;flex-direction:column">
  <div class="topbar">
    <div style="font-size:16px;font-weight:900;background:linear-gradient(135deg,#3b82f6,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent">⚡ StreamVault Admin</div>
    <div style="flex:1"></div>
    <button class="btn-secondary btn-sm" onclick="doLogout()">Sign Out</button>
  </div>
  <div class="shell">
    <div class="sidenav">
      <div class="nav-item active" data-page="overview" onclick="nav(this)"><span>📊</span> Overview</div>
      <div class="nav-item" data-page="resellers" onclick="nav(this)"><span>👥</span> Resellers</div>
      <div class="nav-item" data-page="create" onclick="nav(this)"><span>➕</span> Add Reseller</div>
    </div>
    <div class="content">

      <!-- Overview -->
      <div class="page active" id="page-overview">
        <div class="page-title">Overview</div>
        <div class="stats-grid">
          <div class="stat"><div class="stat-val" id="ov-total">—</div><div class="stat-lbl">Total Resellers</div></div>
          <div class="stat"><div class="stat-val" id="ov-active">—</div><div class="stat-lbl">Active</div></div>
          <div class="stat"><div class="stat-val" id="ov-lookups">—</div><div class="stat-lbl">Total App Connections</div></div>
          <div class="stat"><div class="stat-val" id="ov-today">—</div><div class="stat-lbl">Connections Today</div></div>
        </div>
      </div>

      <!-- Resellers list -->
      <div class="page" id="page-resellers">
        <div class="page-title">Resellers</div>
        <div class="card" style="overflow:auto">
          <table>
            <thead>
              <tr><th>Name</th><th>Code</th><th>DNS</th><th>Plan</th><th>Connections</th><th>Last Active</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="resellers-tbody">
              <tr><td colspan="8" style="text-align:center;color:var(--sub);padding:32px">Loading…</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- Create reseller -->
      <div class="page" id="page-create">
        <div class="page-title">Add Reseller</div>
        <div class="card" style="max-width:480px">
          <div class="field"><label>Name / Company</label><input id="c-name" type="text" placeholder="Acme IPTV" style="width:100%"/></div>
          <div class="field"><label>Email</label><input id="c-email" type="email" placeholder="reseller@example.com" style="width:100%"/></div>
          <div class="field"><label>Password</label><input id="c-pass" type="password" placeholder="Min 8 characters" style="width:100%"/></div>
          <div class="field"><label>DNS / Server URL</label><input id="c-dns" type="url" placeholder="http://server.com:8080" style="width:100%"/></div>
          <div style="display:flex;gap:12px;margin-bottom:16px">
            <div class="field" style="flex:1">
              <label>Plan</label>
              <select id="c-plan" style="width:100%">
                <option value="trial">Trial</option>
                <option value="basic">Basic</option>
                <option value="pro">Pro</option>
              </select>
            </div>
            <div class="field" style="flex:1">
              <label>Client Limit</label>
              <input id="c-limit" type="number" value="10" style="width:100%"/>
            </div>
          </div>
          <div id="c-err" class="error-box"></div>
          <button class="btn-primary" onclick="createReseller()">Create Reseller</button>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Edit modal -->
<div id="edit-modal" style="display:none" class="modal-bg" onclick="closeEdit()">
  <div class="modal" onclick="event.stopPropagation()">
    <div style="font-size:18px;font-weight:900;margin-bottom:20px">Edit Reseller</div>
    <input type="hidden" id="edit-id"/>
    <div class="field"><label>DNS / Server URL</label><input id="edit-dns" type="url" style="width:100%"/></div>
    <div style="display:flex;gap:12px;margin-bottom:20px">
      <div class="field" style="flex:1"><label>Plan</label>
        <select id="edit-plan" style="width:100%">
          <option value="trial">Trial</option><option value="basic">Basic</option><option value="pro">Pro</option>
        </select>
      </div>
      <div class="field" style="flex:1"><label>Client Limit</label><input id="edit-limit" type="number" style="width:100%"/></div>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn-primary" onclick="saveEdit()">Save Changes</button>
      <button class="btn-secondary" onclick="closeEdit()">Cancel</button>
    </div>
  </div>
</div>

<script>
const API = "https://streamvault-backend-production-3d54.up.railway.app";
let TOKEN = localStorage.getItem("sv_admin_token");

async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (TOKEN) opts.headers["Authorization"] = "Bearer " + TOKEN;
  if (body)  opts.body = JSON.stringify(body);
  const res = await fetch(API + path, opts);
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || "Error");
  return data;
}

function toast(msg) {
  const t = document.createElement("div"); t.className="toast"; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}

async function doLogin() {
  const email = document.getElementById("a-email").value.trim();
  const pass  = document.getElementById("a-pass").value;
  const err   = document.getElementById("a-err");
  err.style.display="none";
  try {
    const d = await api("POST","/admin/login",{email,password:pass});
    TOKEN = d.token;
    localStorage.setItem("sv_admin_token",TOKEN);
    showApp();
  } catch(e) { err.textContent=e.message; err.style.display="block"; }
}

function doLogout() {
  TOKEN=null; localStorage.removeItem("sv_admin_token");
  document.getElementById("login-screen").style.display="flex";
  document.getElementById("app").style.display="none";
}

async function showApp() {
  document.getElementById("login-screen").style.display="none";
  document.getElementById("app").style.display="flex";
  await loadStats();
  await loadResellers();
}

function nav(el) {
  document.querySelectorAll(".nav-item").forEach(n=>n.classList.remove("active"));
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  el.classList.add("active");
  document.getElementById("page-"+el.dataset.page).classList.add("active");
  if (el.dataset.page==="resellers") loadResellers();
  if (el.dataset.page==="overview")  loadStats();
}

async function loadStats() {
  try {
    const s = await api("GET","/admin/stats");
    document.getElementById("ov-total").textContent   = s.total_resellers;
    document.getElementById("ov-active").textContent  = s.active_resellers;
    document.getElementById("ov-lookups").textContent = s.total_lookups;
    document.getElementById("ov-today").textContent   = s.lookups_today;
  } catch {}
}

async function loadResellers() {
  const tbody = document.getElementById("resellers-tbody");
  try {
    const list = await api("GET","/admin/resellers");
    if (!list.length) { tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--sub);padding:32px">No resellers yet</td></tr>'; return; }
    tbody.innerHTML = list.map(r => `
      <tr>
        <td><strong>${r.name}</strong><br><span style="font-size:11px;color:var(--sub)">${r.email}</span></td>
        <td><code style="background:var(--muted);padding:3px 8px;border-radius:4px;color:#60a5fa;font-size:12px;letter-spacing:1px">${r.code}</code></td>
        <td style="max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--sub)">${r.dns||'<span style="color:#f87171">Not set</span>'}</td>
        <td><span class="badge ${r.plan==='pro'?'badge-blue':r.plan==='basic'?'badge-yellow':'badge-blue'}">${r.plan.toUpperCase()}</span></td>
        <td>${r.total_lookups||0}</td>
        <td style="font-size:11px;color:var(--sub)">${r.last_active ? new Date(r.last_active).toLocaleDateString() : 'Never'}</td>
        <td><span class="badge ${r.active?'badge-green':'badge-red'}">${r.active?'Active':'Suspended'}</span></td>
        <td>
          <div class="actions">
            <button class="btn-secondary btn-sm" onclick="openEdit(${r.id},'${r.dns||''}','${r.plan}',${r.client_limit})">Edit</button>
            <button class="${r.active?'btn-danger':'btn-success'} btn-sm" onclick="toggleStatus(${r.id},${r.active?0:1})">${r.active?'Suspend':'Activate'}</button>
            <button class="btn-danger btn-sm" onclick="deleteReseller(${r.id},'${r.name}')">Delete</button>
          </div>
        </td>
      </tr>
    `).join("");
  } catch(e) { tbody.innerHTML=`<tr><td colspan="8" style="color:#f87171;padding:20px">${e.message}</td></tr>`; }
}

async function createReseller() {
  const err = document.getElementById("c-err");
  err.style.display="none";
  const body = {
    name:  document.getElementById("c-name").value.trim(),
    email: document.getElementById("c-email").value.trim(),
    password: document.getElementById("c-pass").value,
    dns:   document.getElementById("c-dns").value.trim(),
    plan:  document.getElementById("c-plan").value,
    client_limit: parseInt(document.getElementById("c-limit").value)||10,
  };
  if (!body.name||!body.email||!body.password) { err.textContent="Fill required fields"; err.style.display="block"; return; }
  try {
    const d = await api("POST","/admin/resellers",body);
    toast(`✓ Reseller created — Code: ${d.reseller.code}`);
    ["c-name","c-email","c-pass","c-dns"].forEach(id=>document.getElementById(id).value="");
  } catch(e) { err.textContent=e.message; err.style.display="block"; }
}

async function toggleStatus(id, active) {
  try { await api("PUT",`/admin/resellers/${id}/status`,{active}); await loadResellers(); toast(active?"✓ Reseller activated":"Reseller suspended"); }
  catch(e) { toast("⚠ "+e.message); }
}

async function deleteReseller(id, name) {
  if (!confirm(`Delete reseller "${name}"? This cannot be undone.`)) return;
  try { await api("DELETE",`/admin/resellers/${id}`); await loadResellers(); toast("Reseller deleted"); }
  catch(e) { toast("⚠ "+e.message); }
}

function openEdit(id, dns, plan, limit) {
  document.getElementById("edit-id").value    = id;
  document.getElementById("edit-dns").value   = dns;
  document.getElementById("edit-plan").value  = plan;
  document.getElementById("edit-limit").value = limit;
  document.getElementById("edit-modal").style.display = "flex";
}
function closeEdit() { document.getElementById("edit-modal").style.display="none"; }

async function saveEdit() {
  const id    = document.getElementById("edit-id").value;
  const dns   = document.getElementById("edit-dns").value.trim();
  const plan  = document.getElementById("edit-plan").value;
  const limit = parseInt(document.getElementById("edit-limit").value)||10;
  try {
    await Promise.all([
      api("PUT",`/admin/resellers/${id}/dns`,{dns}),
      api("PUT",`/admin/resellers/${id}/plan`,{plan,client_limit:limit}),
    ]);
    closeEdit(); await loadResellers(); toast("✓ Reseller updated");
  } catch(e) { toast("⚠ "+e.message); }
}

// Boot
if (TOKEN) showApp().catch(doLogout);
</script>
</body>
</html>
